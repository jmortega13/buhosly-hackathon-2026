services:
  postgres:
    image: postgres:16-alpine
    container_name: buhosly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buhosly
      POSTGRES_USER: buhosly
      POSTGRES_PASSWORD: buhosly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buhosly -d buhosly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
