spring:
  application:
    name: buhosly

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/buhosly}
    username: ${SPRING_DATASOURCE_USERNAME:buhosly}
    password: ${SPRING_DATASOURCE_PASSWORD:buhosly}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    # Comma-separated list of allowed origins. Set CORS_ALLOWED_ORIGINS in
    # production to include the Vercel URL (and any preview URLs you care
    # about). Falls back to localhost:4200 for local dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  jwt:
    secret: ${JWT_SECRET:}
    expires-minutes: 720

  auth:
    # Comma-separated list of email domains allowed at sign-in. Override at
    # deploy time with ALLOWED_DOMAINS=synacy.com,rise.com,other.com (no spaces).
    allowed-domains: ${ALLOWED_DOMAINS:synacy.com,rise.ph}
    admin-emails: ${ADMIN_EMAILS:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  allowance:
    default-points: 30
    birthday-top-up: ${BIRTHDAY_TOP_UP:20}
    zone: Asia/Manila

  feed:
    default-page-size: 25
    max-page-size: 100

  giphy:
    api-key: ${GIPHY_API_KEY:}

logging:
  level:
    com.synacy.buhosly: INFO
